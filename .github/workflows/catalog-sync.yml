name: Automated Catalog Sync

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  repository_dispatch:
    types: [charts-published, catalog-sync]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-catalog:
    name: Sync Catalog from Charts Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Checkout charts repo
        uses: actions/checkout@v7
        with:
          repository: helmforgedev/charts
          path: .charts-repo
          sparse-checkout: |
            charts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog & metadata
        run: npm run catalog:generate

      - name: Check for catalog changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain src/data/catalog.json src/data/charts.ts)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Catalog drift detected. Preparing synchronization PR."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Catalog is fully up to date with charts repository."
          fi

      - name: Create Pull Request for Catalog Sync
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="automation/catalog-sync-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add src/data/catalog.json src/data/charts.ts
          git commit -m "chore(catalog): sync charts catalog and schemas from upstream [skip ci]"
          git push -u origin "$BRANCH_NAME" --force
          
          # Check if an existing open PR already exists
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --json number -q '.[0].number' || true)
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "chore(catalog): synchronize charts catalog and schemas" \
              --body "Automated catalog synchronization from \`helmforgedev/charts\`. Updates \`src/data/catalog.json\` and \`src/data/charts.ts\` to maintain parity across documentation, Values Studio v2.0, and Stack Builder." \
              --label "documentation" \
              --base main
          fi
