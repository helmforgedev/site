# SPDX-License-Identifier: Apache-2.0
name: Automation - Contributors

# Refreshes the contributors data used by the community page.
# Requires repo/org secret OPS_AUTOMATION_TOKEN with contents+pull_requests write.

on:
  schedule:
    - cron: '45 6 * * *' # Daily 06:45 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.OPS_AUTOMATION_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh contributors data
        env:
          GITHUB_TOKEN: ${{ secrets.OPS_AUTOMATION_TOKEN }}
        run: node scripts/generate-contributors-data.mjs helmforgedev/charts src/data/contributors.ts

      - name: Open refresh PR
        env:
          GH_TOKEN: ${{ secrets.OPS_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git diff --quiet -- src/data/contributors.ts; then
            echo "Contributors data is current."
            exit 0
          fi

          git config user.name "helmforge-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/contributors-refresh
          git add src/data/contributors.ts
          git commit -m "docs(contributors): refresh contributors data"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin HEAD:automation/contributors-refresh

          if gh pr view automation/contributors-refresh --json number >/dev/null 2>&1; then
            gh pr edit automation/contributors-refresh \
              --title "docs(contributors): refresh contributors data" \
              --body "Refreshes the contributors data used by the community page."
          else
            gh pr create \
              --base main \
              --head automation/contributors-refresh \
              --title "docs(contributors): refresh contributors data" \
              --body "Refreshes the contributors data used by the community page."
          fi
